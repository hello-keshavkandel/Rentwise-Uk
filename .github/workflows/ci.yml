name: CI

on:
  push:
    branches: [main, "feature/**", "product/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # same as the live app and Docker
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-api.txt -r requirements-dev.txt
      - name: Lint (ruff)
        continue-on-error: true       # advisory: a few legacy long lines remain
        run: ruff check .
      - name: Verify (env, health, all tests, live API + dashboard)
        run: python scripts/verify.py
        # Tests that need the (git-ignored) raw data skip automatically.
      - name: Upload verify report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: reports/verify_report.md
